name: Weekly link check

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check tool links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every link in tools.json
        working-directory: site
        run: node scripts/check-links.mjs --md > "$RUNNER_TEMP/report.md"

      # One rolling issue, not one per link. Updated while links are broken, closed when they're fixed.
      - name: Open, update or close the report issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create dead-links --description "Opened by the weekly link check" --color B60205 2>/dev/null || true
          existing=$(gh issue list --label dead-links --state open --json number --jq '.[0].number')
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$RUNNER_TEMP/report.md"
              gh issue comment "$existing" --body "Checked again on $(date -u +%F). The list above is current."
            else
              gh issue create --title "Dead links found by the weekly check" --label dead-links --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links load again as of $(date -u +%F). Closing."
          fi
